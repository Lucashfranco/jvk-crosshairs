# Toda segunda: atualiza times e elencos pelo Valve Regional Standings e publica os envios aprovados.
# Precisa dos secrets SUPABASE_URL e SUPABASE_SERVICE_KEY (chave secret do Supabase) no repositório.
name: Publicar miras

on:
  schedule:
    - cron: "0 9 * * 1" # segunda, 06:00 em Brasília
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Atualizar times e publicar envios
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m jvk_pipeline.publish
