<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel Twitch</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Painel da Twitch: 320 px de largura (gerado em 2x) */
  .panel {
    width: 320px; height: 470px; padding: 20px 20px 14px;
    background:
      radial-gradient(120% 70% at 100% 0%, rgba(139, 92, 246, .22), transparent 60%),
      linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    border: 1px solid var(--glow); border-radius: 6px;
    display: flex; flex-direction: column;
  }
  .brand .jvk { font-size: 26px; }
  .brand .sub { font-size: 9.5px; margin-top: 4px; }
  .tag { font-size: 10px; margin: 18px 0 6px; }
  h1 { font-family: Oxanium; font-weight: 700; font-size: 23px; line-height: 1.15; }
  h1 em { font-style: normal; color: var(--accent-light); }
  ul { list-style: none; margin-top: 14px; display: grid; gap: 8px; }
  li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.3; }
  li b { color: var(--text); font-weight: 600; }
  li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .pros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: auto; }
  .pros .scope { height: 76px; }
  .pros .who { font-size: 10.5px; }
  .free { margin-top: 10px; text-align: center; font-size: 11px; color: var(--muted); }
  .free b { color: var(--text); font-weight: 600; }
  .cta {
    flex: none; margin-top: 12px; height: 34px; border-radius: 6px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 600; font-size: 13.5px; color: #fff;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.4" stroke-linecap="round">
      <circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/><circle cx="12" cy="12" r="1.2" fill="#8B5CF6" stroke="none"/>
    </svg>
    <div><div class="jvk">JVK</div><div class="sub">CROSSHAIRS</div></div>
  </div>

  <div class="tag">[ miras dos pros de cs2 ]</div>
  <h1>A mira dos pros <em>no seu CS2</em></h1>

  <ul>
    <li><span><b>Top 20 da Valve:</b> as miras dos 100 jogadores dos melhores times</span></li>
    <li><span><b>Copie e cole:</b> código CS… pronto pra importar no jogo</span></li>
    <li><span><b>Sempre atual:</b> atualizado toda semana</span></li>
  </ul>

  <div class="pros">
    <div class="scope" data-pro="0"></div>
    <div class="scope" data-pro="1"></div>
    <div class="scope" data-pro="3"></div>
  </div>
  <div class="cta">Ver as miras dos pros
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </div>
  <div class="free"><b>Grátis</b> · jvk-crosshairs.vercel.app</div>
</div>
<script src="miras.js"></script>
<script>
  document.querySelectorAll("[data-pro]").forEach((el) => fillScope(el, PROS[el.dataset.pro], 44));
</script>
</body>
</html>
